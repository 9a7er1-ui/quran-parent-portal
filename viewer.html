<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>سجل درجات الطلاب — عرض للقراءة فقط</title>
<style>
  html, body { margin: 0; height: 100%; font: 15px Tahoma, Arial, sans-serif; background: #f4f7f5; color: #193d34; }
  #bar { background: #205348; color: #fff; padding: 9px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; min-height: 26px; }
  #bar b { font-size: 15px; }
  #left { margin-inline-start: auto; font-size: 13px; opacity: .9; }
  #msg { max-width: 560px; margin: 60px auto; padding: 22px; background: #fff; border-radius: 12px; border: 1px solid #d5e3dc; text-align: center; line-height: 1.8; }
  #msg.err { border-color: #f0a49b; color: #b42318; }
  iframe { border: 0; width: 100%; height: calc(100% - 44px); display: block; background: #f4f7f5; }
</style>
</head>
<body>
<div id="bar"><b>عرض للقراءة فقط</b><span>لا يمكن تعديل أي درجة من هذه الصفحة</span><span id="left"></span></div>
<div id="msg">جارٍ التحقق من الرابط...</div>
<iframe id="app" title="سجل الدرجات للقراءة فقط" sandbox="allow-scripts allow-modals" hidden></iframe>
<script>
(() => {
  'use strict';
  // إعدادات عامة (المفتاح عام بطبيعته؛ الحماية الفعلية في دالة الخادم get_shared_gradebook)
  const SUPABASE_URL = 'https://bobjfngkrepajfsmaihk.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_tlHAjfYiVXXq81ponT7E-g_fniIquBM';
  const RECHECK_MS = 5 * 60 * 1000;

  const msg = document.getElementById('msg'), frame = document.getElementById('app'), left = document.getElementById('left');
  const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
  let expiresAt = null;

  function fail(text) {
    frame.hidden = true; frame.srcdoc = ''; frame.removeAttribute('srcdoc');
    msg.hidden = false; msg.className = 'err'; msg.textContent = text; left.textContent = '';
  }

  async function fetchShared() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_shared_gradebook', {
      method: 'POST', cache: 'no-store',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
      body: JSON.stringify({ p_token: token })
    });
    if (!res.ok) { const e = new Error('expired'); e.status = res.status; throw e; }
    const out = await res.json();
    if (!out || !out.db || !Array.isArray(out.db.students)) throw new Error('expired');
    return out;
  }

  function memStoreScript(db) {
    const init = {
      'quran-offline-v1': JSON.stringify(db),
      'quran-main-area': 'study',
      'quran-last-tab': 'register',
      'quran-fullsync-auto-v2': '0'
    };
    const json = JSON.stringify(init).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    return '<script>(function(){function S(i){var m=new Map(Object.entries(i||{}));return{getItem:function(k){return m.has(k)?m.get(k):null},setItem:function(k,v){m.set(String(k),String(v))},removeItem:function(k){m.delete(k)},clear:function(){m.clear()},key:function(n){return Array.from(m.keys())[n]||null},get length(){return m.size}}}window.__vStore=S(' + json + ');window.__vSess=S({});})();<\/script>';
  }

  // طبقة القراءة فقط داخل الإطار: إخفاء أقسام أولياء الأمور وإدارة البيانات، وتعطيل كل خانات الإدخال وأزرار الرصد.
  const READONLY = `<style>
    #mainAreas button[data-area="parents"], #mainAreas button[data-area="data"], #fsAutoBadge, .bulk-course-head input, .bulk-course-btn { display: none !important; }
    input:not([type="radio"]), textarea { pointer-events: none !important; background: #f3f6f4 !important; }
    td, td * { cursor: default !important; }
  </style>
  <script>(function(){
    var NAV_SELECTS = { subjectSelect: 1, sectionSelect: 1 };
    function lock(root){
      (root.querySelectorAll ? root : document).querySelectorAll('input, textarea').forEach(function(el){
        if (el.type === 'radio') return;
        el.readOnly = true; el.disabled = true; el.tabIndex = -1;
      });
      document.querySelectorAll('select').forEach(function(el){
        if (NAV_SELECTS[el.id] || el.closest('#scope') || el.closest('#view') || el.closest('nav')) return;
        if (el.closest('table')) el.disabled = true;
      });
    }
    function isEditTarget(t){
      if (!t || !t.closest) return false;
      if (t.closest('#mainAreas') || t.closest('#tabs') || t.closest('#scope') || t.closest('header')) return false;
      if (t.closest('td')) return true;
      var b = t.closest('button');
      if (b && /حذف|مسح|إضافة|أضف|حفظ|تعميم|اعتماد|استيراد|نقل|تعديل|إعادة|رفع|مزامنة|ربط|رمز|أرشف|تصفير|إلغاء/.test(b.textContent || '')) return true;
      return false;
    }
    ['click','dblclick','keydown','change','input','paste','drop'].forEach(function(type){
      document.addEventListener(type, function(ev){
        if (type === 'keydown' && !(ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName))) return;
        if (type === 'change' || type === 'input') { if (ev.target && ev.target.closest && (ev.target.closest('#scope') || NAV_SELECTS[ev.target.id])) return; if (ev.target && ev.target.tagName === 'SELECT' && !ev.target.closest('table')) return; }
        if (type === 'change' || type === 'input' || type === 'paste' || type === 'drop' || type === 'keydown' || isEditTarget(ev.target)) {
          ev.preventDefault(); ev.stopImmediatePropagation();
        }
      }, true);
    });
    lock(document);
    new MutationObserver(function(){ lock(document); }).observe(document.documentElement, { childList: true, subtree: true });
  })();<\/script>`;

  function buildAppHtml(indexHtml, db) {
    let h = indexHtml;
    h = h.replace(/<script[^>]*src="\.\/parent-sync\.js[^"]*"[^>]*><\/script>/g, '');
    h = h.replace(/navigator\.serviceWorker\.register\([^)]*\)/g, 'Promise.resolve()');
    h = h.replace(/\blocalStorage\b/g, '__vStore').replace(/\bsessionStorage\b/g, '__vSess');
    const base = '<base href="' + location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '') + '">';
    const headInject = base + memStoreScript(db);
    if (/<head[^>]*>/i.test(h)) h = h.replace(/<head[^>]*>/i, m => m + headInject); else h = headInject + h;
    if (/<\/html>\s*$/i.test(h)) h = h.replace(/<\/html>\s*$/i, READONLY + '</html>'); else h += READONLY;
    return h;
  }

  function showLeft() {
    if (!expiresAt) return;
    const ms = new Date(expiresAt).getTime() - Date.now();
    if (ms <= 0) { fail('انتهت صلاحية هذا الرابط. اطلب رابطًا جديدًا من المعلم.'); return; }
    const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
    left.textContent = 'ينتهي الرابط بعد ' + h + ' ساعة و' + m + ' دقيقة';
  }

  async function start() {
    if (!/^[A-Za-z0-9_-]{30,}$/.test(token)) { fail('الرابط غير صالح. تأكد من نسخه كاملًا أو امسح الباركود مرة أخرى.'); return; }
    try {
      const shared = await fetchShared();
      expiresAt = shared.expires_at;
      const indexRes = await fetch('./index.html', { cache: 'no-cache' });
      if (!indexRes.ok) throw new Error('index');
      const html = buildAppHtml(await indexRes.text(), shared.db);
      frame.srcdoc = html; frame.hidden = false; msg.hidden = true;
      showLeft(); setInterval(showLeft, 30000);
      setInterval(async () => { try { await fetchShared(); } catch (e) { if (e.status || e.message === 'expired') fail('انتهت صلاحية هذا الرابط أو أُلغي. اطلب رابطًا جديدًا من المعلم.'); } }, RECHECK_MS);
    } catch (e) {
      if (e.message === 'index') fail('تعذّر تحميل صفحة العرض. أعد المحاولة.');
      else if (e.status || e.message === 'expired') fail('هذا الرابط غير صالح، أو انتهت صلاحيته، أو ألغاه المعلم. اطلب رابطًا جديدًا.');
      else fail('تعذّر الاتصال. تأكد من الإنترنت ثم أعد فتح الرابط.');
    }
  }
  window.addEventListener('hashchange', () => location.reload());
  start();
})();
</script>
</body>
</html>
