<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>بوابة ولي الأمر — سجل درجات الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1f5a4c; --green-dark:#173f36; --ink:#17322b; --muted:#5b7068; --line:#d9e5df;
    --bg:#f3f6f4; --card:#fff; --soft:#f7faf8;
    --good:#1d6b43; --good-bg:#eaf6ef; --mid:#8a6400; --mid-bg:#fff6df; --need:#a43b1c; --need-bg:#fdeee8;
    --radius:14px; --pad:clamp(14px,3.5vw,22px);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-variant-ligatures:no-common-ligatures;font-feature-settings:"liga" 0,"dlig" 0;margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 "IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:920px;margin:0 auto;padding:0 12px}
  header{background:var(--green);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;margin-bottom:12px}
  header h1{margin:0;font-size:1.35rem;font-weight:700}
  header p{margin:2px 0 0;color:#d9ece5;font-size:.95rem}
  section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad);margin:12px 0}
  h2{font-size:1.3rem;margin:0 0 4px;line-height:1.5}
  h3{font-size:1.1rem;margin:0 0 10px;line-height:1.5}
  h4{font-size:1rem;margin:14px 0 6px}
  p{margin:6px 0}
  .muted{color:var(--muted);font-size:.92rem}
  .error{color:var(--need);font-weight:700}
  button,input,select,textarea{font:inherit;color:inherit}
  input,textarea,select{width:100%;padding:11px 12px;border:1px solid #b9cdc3;border-radius:10px;background:#fff;margin:5px 0}
  textarea{resize:vertical;line-height:1.7}
  button{cursor:pointer;width:100%;padding:12px 14px;margin:5px 0;border-radius:10px;border:1px solid var(--green);background:var(--green);color:#fff;font-weight:500;min-height:46px}
  button.secondary{background:#fff;color:var(--green)}
  button:disabled{opacity:.6;cursor:default}
  .num{direction:ltr;unicode-bidi:isolate;display:inline-block}
  .card{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:var(--pad);margin:12px 0}
  .card.good{background:var(--good-bg);border-color:#bfe0cc}
  .card.warn{background:var(--mid-bg);border-color:#ecd28f}
  .plan{white-space:pre-wrap;line-height:1.9}
  .new-pill{background:#b3261e;color:#fff;border-radius:999px;padding:1px 9px;font-size:.78rem;vertical-align:middle;font-weight:500}

  /* أزرار التبديل */
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tabs button{flex:1}
  .tabs button.active,.seg button.active{background:var(--green-dark);color:#fff}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .seg{grid-column:1/-1;display:flex;gap:8px}
  .seg button{flex:1;background:#fff;color:var(--green);margin:0}
  .controls label{display:block;font-size:.92rem;color:var(--muted)}
  .controls select{margin-top:2px}

  /* المستوى */
  .lvl{display:inline-block;padding:2px 12px;border-radius:999px;font-weight:700;font-size:.95rem}
  .lvl.good{background:var(--good-bg);color:var(--good)}
  .lvl.mid{background:var(--mid-bg);color:var(--mid)}
  .lvl.need{background:var(--need-bg);color:var(--need)}
  .lvl.none{background:#eef2f0;color:var(--muted)}
  .overall{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .overall .big{font-size:1.6rem;font-weight:700}
  .bar{height:10px;border-radius:99px;background:#e4ece8;overflow:hidden;margin:8px 0 2px}
  .bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
  .subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:10px;margin-top:12px}
  .subject{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .subject h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .subject p{margin:4px 0;font-size:.95rem}

  /* مؤشرات الموسع */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;margin:8px 0}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat span{display:block;font-size:.88rem;color:var(--muted);line-height:1.5}
  .stat b{display:block;font-size:1.15rem;margin-top:2px}
  .dist{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:.92rem}
  .dist .bar{margin:0}

  /* السجل اليومي على شكل أسابيع */
  .weeks{display:grid;gap:8px}
  .week{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
  .week b{display:block;margin-bottom:6px}
  .days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .day{border-radius:8px;padding:6px 2px;text-align:center;font-size:.85rem;line-height:1.4;background:#f1f5f3}
  .day small{display:block;color:var(--muted);font-size:.75rem}
  .day.full{background:var(--good-bg)} .day.low{background:var(--need-bg)} .day.abs{background:#ececec;color:#555} .day.none{background:#f7f7f7;color:#999}
  table{border-collapse:collapse;width:100%;margin-top:8px;font-size:.92rem}
  th,td{border:1px solid var(--line);padding:7px 6px;text-align:center;vertical-align:middle}
  th{background:#edf4f0;font-weight:500}
  .tbl{overflow-x:auto}
  ul.clean{margin:6px 0;padding-inline-start:20px}
  ul.clean li{margin:3px 0}
  .badge-good,.badge-need{display:inline-block;padding:3px 11px;border-radius:999px;margin:3px 0 3px 4px;font-size:.92rem}
  .badge-good{background:var(--good-bg);color:var(--good)} .badge-need{background:var(--need-bg);color:var(--need)}
  details>summary{cursor:pointer;font-weight:700;padding:4px 0}

  /* هذا الأسبوع والإقرار */
  .weekly{border:2px solid var(--green)}
  .weekly .meta{font-size:.88rem;color:var(--muted)}
  .ack-done{color:var(--good);font-weight:700}
  .pledge{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
  .pledge-check{display:flex;gap:10px;align-items:flex-start;font-weight:500;line-height:1.7}
  .pledge-check input{width:22px;height:22px;margin:4px 0 0;flex:none}

  /* المحادثة */
  .chat{max-height:380px;overflow:auto;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
  .bubble{padding:9px 12px;border-radius:12px;margin:7px 0;max-width:88%;word-break:break-word}
  .bubble .body{white-space:pre-wrap;line-height:1.8}
  .bubble .when{font-size:.75rem;color:var(--muted);margin-top:4px}
  .bubble.parent{margin-right:auto;background:#dcefe7}
  .bubble.teacher{margin-left:auto;background:#fff;border:1px solid var(--line)}

  /* لوحة المعلم (المعاينة فقط) */
  .teacher-followup{background:#fff;border:2px solid #aac1b4}
  .teacher-followup label{display:block;font-weight:700;margin-top:10px}
  .teacher-followup .checkline{display:flex;gap:8px;align-items:center}
  .teacher-followup .checkline input{width:auto}
  .save-ok{font-weight:700;color:var(--good)}
  #renameStudentBtn{width:auto;display:inline-block;min-height:auto;padding:6px 14px;font-size:.9rem;margin-inline-start:8px}

  @media (min-width:700px){
    body{font-size:16px}
    .controls{grid-template-columns:2fr 1fr 1fr}
    .seg{grid-column:auto}
    header{border-radius:0 0 18px 18px}
    button{width:auto}
    .tabs button,.seg button,.send-msg{width:100%}
  }
  @media print{
    header,.controls,#renameStudentBtn,.teacher-followup,.chat-card,.no-print{display:none!important}
    body{background:#fff}
    section,.card{border-color:#bbb;break-inside:avoid}
  }
</style>
</head>
<body>
<header><div class="wrap"><h1>بوابة ولي الأمر</h1><p>متابعة ابنك أولًا بأول</p></div></header>
<main class="wrap">
<section id="authBox"></section>
<div id="reportsBox" style="display:none"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// إعدادات Supabase (نفس القيمتين في parent-sync.js)
// ============================================================
const SUPABASE_URL = 'https://bobjfngkrepajfsmaihk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tlHAjfYiVXXq81ponT7E-g_fniIquBM';
// ============================================================

let supa = null;
const authBox = document.getElementById('authBox');
const reportsBox = document.getElementById('reportsBox');
const PENDING_CODE_KEY = 'parent-pending-code';
const KNOWN_KEY = 'parent-known-students';
const SELECTED_KEY = 'parent-selected-student';
const WEEKLY_PREFIXES = ['الخطة العلاجية الأسبوعية', 'خطة علاجية', 'خطاب شكر وعرفان', 'إشعار مخالفات'];
const WEEKLY_DAYS = 10, WEEKLY_UNACK_DAYS = 30;
(function captureCode(){
  const p = new URLSearchParams(location.search);
  const c = p.get('code');
  if(c){
    try{ localStorage.setItem(PENDING_CODE_KEY, c.trim().toUpperCase()); }catch(_){}
    p.delete('code');
    const rest = p.toString();
    history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
  }
})();
function pendingCode(){ try{ return localStorage.getItem(PENDING_CODE_KEY); }catch(_){ return null; } }
function clearPendingCode(){ try{ localStorage.removeItem(PENDING_CODE_KEY); }catch(_){} }
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(_){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}

// أرقام لا تنقلب في الكتابة من اليمين: «5 من 7» بدل «5 / 7»
function n(v){if(v===null||v===undefined||v==='')return '—';const x=typeof v==='number'?Math.round(v*100)/100:v;return `<span class="num">${escapeHtml(x)}</span>`}
function of(a,b){return `${n(a)} من ${n(b)}`}
function pctTxt(p){return p===null||p===undefined||!Number.isFinite(p)?'—':`<span class="num">${Math.round(p)}٪</span>`}

let reportMode=lsGet('parent-report-mode','short'),reportSemester=Number(lsGet('parent-report-semester',0)),reportPeriod=Number(lsGet('parent-report-period',0));

function renderControls(){
  return `<div class="controls">
    <div class="seg"><button id="shortReportBtn" type="button" class="${reportMode==='short'?'active':''}">التقرير المختصر</button><button id="expandedReportBtn" type="button" class="${reportMode==='expanded'?'active':''}">التقرير الموسع</button></div>
    <label>الفصل<select id="repSem"><option value="0"${reportSemester===0?' selected':''}>الأول</option><option value="1"${reportSemester===1?' selected':''}>الثاني</option></select></label>
    <label>الفترة<select id="repPeriod"><option value="0"${reportPeriod===0?' selected':''}>الأولى</option><option value="1"${reportPeriod===1?' selected':''}>الثانية</option></select></label>
  </div>`;
}

// ---------- حساب المستويات ----------
function levelLabel(pct){
  if(pct===null||pct===undefined||!Number.isFinite(pct))return 'لم يبدأ الرصد بعد';
  if(pct>=92)return 'مرتفع جدًا';
  if(pct>=80)return 'مرتفع';
  if(pct>=65)return 'جيد';
  if(pct>=50)return 'متوسط';
  return 'يحتاج متابعة';
}
function levelClass(pct){if(pct===null||pct===undefined||!Number.isFinite(pct))return 'none';if(pct>=80)return 'good';if(pct>=50)return 'mid';return 'need'}
function lvl(pct){return `<span class="lvl ${levelClass(pct)}">${levelLabel(pct)}</span>`}
function bar(pct){return pct===null||!Number.isFinite(pct)?'':`<div class="bar"><i style="width:${pct<=0?0:Math.max(2,Math.min(100,pct))}%"></i></div>`}

const LEVEL_MIN_DONE=25; // لا يظهر التقدير قبل رصد ربع درجات الفترة على الأقل
function quranCurrentLevel(rep){
  const all=(rep?.quran?.daily||[]).filter(r=>r.period===reportPeriod+1&&!/إجازة|اختبار/.test(String(r.status||'')));
  const rows=all.filter(r=>r.value!==null&&r.value!==undefined);
  const earned=rows.reduce((a,r)=>a+Number(r.value||0),0),possible=rows.length*7,total=all.length*7;
  return {pct:possible?earned/possible*100:null,earned,possible,count:rows.length,total,done:total?possible/total*100:0};
}
function courseCurrentLevel(rows){
  const r=(rows||[]).find(x=>x.period===reportPeriod+1);if(!r)return null;
  let earned=0,possible=0,count=0,total=0;
  const cats=(r.categories||[]).filter(c=>!c.violation).map(c=>{const maxPer=c.count?c.max/c.count:0,observedMax=(c.filled||0)*maxPer;earned+=Number(c.earned||0);possible+=observedMax;total+=Number(c.max||0);count+=Number(c.filled||0);return {...c,observedMax}});
  return {pct:possible?earned/possible*100:null,earned,possible,count,total,done:total?possible/total*100:0,cats,violations:r.violations||0,deduction:r.deduction||0,stars:r.stars||0,scaled:r.scaled,target:r.target,raw:r};
}
function enough(x){return x&&x.pct!==null&&x.done>=LEVEL_MIN_DONE}
function overallCurrentLevel(rep){
  const vals=[];const q=quranCurrentLevel(rep);if(rep.quran&&enough(q))vals.push(q.pct);
  for(const key of ['islamic','tajweed','life']){const x=courseCurrentLevel(rep[key]);if(enough(x))vals.push(x.pct)}
  return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
}

// ---------- المختصر: المستوى العام وبطاقات المواد ----------
function levelBadge(x){
  if(!x||x.pct===null)return '<span class="lvl none">لم يبدأ الرصد</span>';
  if(x.done<LEVEL_MIN_DONE)return '<span class="lvl none">الرصد في بدايته</span>';
  return lvl(x.pct);
}
function doneBar(x){
  const d=Math.max(0,Math.min(100,x.done||0));
  return `<div class="bar" title="اكتمال الرصد"><i style="width:${d<=0?0:Math.max(2,d)}%"></i></div><p class="muted" style="margin:2px 0 6px">اكتمل رصد ${pctTxt(d)} من درجات الفترة</p>`;
}
function levelLine(x){
  if(!x||x.pct===null)return '';
  if(x.done<LEVEL_MIN_DONE)return `<p>أداؤه فيما رُصد حتى الآن: ${of(Math.round(x.earned*10)/10,Math.round(x.possible*10)/10)} <span class="muted">(يظهر التقدير بعد رصد ربع درجات الفترة)</span></p>`;
  return `<p>${levelLabel(x.pct)} فيما رُصد حتى الآن: ${of(Math.round(x.earned*10)/10,Math.round(x.possible*10)/10)}</p>`;
}
function renderLevels(rep){
  const q=quranCurrentLevel(rep),st=rep.quran?.stats||{},overall=overallCurrentLevel(rep);
  const cards=[];
  if(rep.quran){
    const extra=q.count?`متوسط التسميع ${n((q.earned/q.count).toFixed(1))} من ${n(7)}`+(st.attendanceRate!==null&&st.attendanceRate!==undefined?` • الحضور ${pctTxt(st.attendanceRate)}`:''):'لا يوجد تسميع مرصود في هذه الفترة.';
    cards.push(`<div class="subject"><h4>القرآن الكريم ${levelBadge(q)}</h4>${doneBar(q)}${levelLine(q)}<p class="muted">${extra}</p></div>`);
  }
  for(const [key,title] of [['islamic','الدراسات الإسلامية'],['tajweed','التجويد'],['life','المهارات الحياتية']]){
    const c=courseCurrentLevel(rep[key]);if(!c)continue;
    const sum=c.scaled!==null&&c.scaled!==undefined?`<p class="muted">المجموع المحتسب حتى الآن: ${of(c.scaled,c.target)}${c.done<100?' — لم يكتمل الرصد':''}</p>`:'';
    cards.push(`<div class="subject"><h4>${title} ${levelBadge(c)}</h4>${doneBar(c)}${c.pct===null?'<p class="muted">لم يبدأ الرصد بعد.</p>':levelLine(c)}${sum}${c.violations?`<p class="muted">مخالفات: ${n(c.violations)}</p>`:''}</div>`);
  }
  const head=overall===null?'<div class="big" style="font-size:1.2rem">الرصد في بدايته</div>':`<div class="big">${levelLabel(overall)} ${pctTxt(overall)}</div>`;
  return `<div class="card"><div class="overall"><div><h3 style="margin:0">المستوى العام</h3><span class="muted">فيما رُصد حتى الآن، للمواد التي اكتمل ربع رصدها على الأقل</span></div>${head}</div><div class="subjects">${cards.join('')}</div></div>`;
}

function renderTeacherCards(rep){
  const sp=rep.support||{};let h='';
  if(sp.praise)h+=`<div class="card good"><h3>إشادة من المعلم</h3><div class="plan">${escapeHtml(sp.praise)}</div></div>`;
  if(sp.teacherNote)h+=`<div class="card"><h3>ملاحظة المعلم</h3><div class="plan">${escapeHtml(sp.teacherNote)}</div></div>`;
  if(sp.goal)h+=`<div class="card"><h3>الهدف الحالي</h3><div class="plan">${escapeHtml(sp.goal)}</div></div>`;
  if(sp.level==='remedial')h+=`<div class="card warn"><h3>خطة التحسين والمتابعة</h3><div class="plan">${escapeHtml(sp.remedialPlan||'سيكتبها المعلم قريبًا.')}</div>${sp.remedialTasks?`<h4>المهام</h4><ul class="clean">${String(sp.remedialTasks).split('\n').filter(x=>x.trim()).map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:''}</div>`;
  if(sp.enrichmentPlan)h+=`<div class="card good"><h3>خطة الإثراء</h3><div class="plan">${escapeHtml(sp.enrichmentPlan)}</div></div>`;
  return h;
}

function parseMissing(list){
  const re=/^(.+?) — الفترة (الأولى|الثانية) — (.+?): متبقٍ (\d+) من (\d+)\.$/,rows=[],notes=[];
  for(const x of list||[]){const m=String(x).match(re);if(m)rows.push({subject:m[1],period:m[2],item:m[3],remaining:+m[4],count:+m[5]});else notes.push(String(x))}
  return {rows,notes};
}
function renderFollowupSummary(rep){
  const strengths=(rep.strengths||[]).map(x=>`<span class="badge-good">✓ ${escapeHtml(x)}</span>`).join('');
  const needs=(rep.needs||[]).map(x=>`<span class="badge-need">${escapeHtml(x)}</span>`).join('');
  const per=reportPeriod===0?'الأولى':'الثانية',miss=parseMissing(rep.missing),rows=miss.rows.filter(r=>r.period===per);
  const short=rows.slice(0,5).map(r=>`<li>${escapeHtml(r.subject)}: ${escapeHtml(r.item)} — باقٍ ${n(r.remaining)} من ${n(r.count)}</li>`).join('');
  return `<div class="card"><h3>ملخص المتابعة</h3>
    <h4>نقاط القوة</h4>${strengths||'<p class="muted">ستظهر مع تقدّم الرصد.</p>'}
    <h4>ما يحتاج إلى تحسين</h4>${needs||'<p class="muted">لا توجد ملاحظة بارزة حاليًا.</p>'}
    <h4>ما الذي ينقصه الآن؟</h4>${short?`<ul class="clean">${short}</ul>${rows.length>5?`<p class="muted">وغيرها ${n(rows.length-5)} — تجدها كاملة في التقرير الموسع.</p>`:''}`:(miss.notes.length?`<ul class="clean">${miss.notes.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:'<p class="muted">لا يظهر نقص مستحق حاليًا.</p>')}
  </div>`;
}

// ---------- الموسع ----------
function renderQuranExpanded(q){
  if(!q)return '';
  const st=q.stats||{},counts=st.gradeCounts||{},p=(q.periods||[]).find(x=>x.period===reportPeriod+1)||{};
  const stat=(label,val)=>`<div class="stat"><span>${label}</span><b>${val}</b></div>`;
  const stats=[
    stat('مجموع درجات التسميع',of(st.totalEarned??0,st.totalPossible??0)),
    stat('متوسط آخر 10 تسميعات',st.last10Average===null||st.last10Average===undefined?'—':of(st.last10Average,7)),
    stat('اتجاه المستوى',escapeHtml(st.trend||'—')),
    stat('نسبة الحضور',pctTxt(st.attendanceRate)),
    stat('أطول تتابع بالدرجة الكاملة',n(st.bestStreak??0)+' مرات'),
    stat('تسميع قبل موعده',n(st.early??0)),
    stat('غياب عوّضه لاحقًا',n(st.madeUpAbsence??0)),
    stat('غياب لم يُعوَّض',n(st.currentAbsence??0))
  ].join('');
  const total=[7,6,5,4,3,2,1,0].reduce((a,k)=>a+(counts[k]||0),0);

const LIFE_SECTION_RE=/(أول\s*متوسط\s*[٦6]$|^1\/6$|^١\/٦$)/;
function cleanReport(rep,sectionName){
  const sec=String(sectionName||rep.section||'').trim();
  if(LIFE_SECTION_RE.test(sec))return rep;
  const r={...rep,life:null};
  r.missing=(rep.missing||[]).filter(x=>!String(x).startsWith('المهارات الحياتية'));
  r.needs=(rep.needs||[]).filter(x=>!String(x).includes('المهارات الحياتية'));
  r.strengths=(rep.strengths||[]).filter(x=>!String(x).includes('المهارات الحياتية'));
  return r;
}
function renderReportBody(rep){

  }
  return h;
}

function chatTime(v){try{return new Date(v).toLocaleString('ar-SA')}catch(_){return v||''}}
function isWeeklyMsg(m){return m.sender_role==='teacher'&&WEEKLY_PREFIXES.some(p=>String(m.body||'').startsWith(p))}

function noticeKind(body){const b=String(body||'');if(b.startsWith('خطاب شكر'))return 'thanks';if(b.startsWith('إشعار مخالفات'))return 'violation';return 'plan'}
function renderWeekly(slot,msgs){
  const now=Date.now(),day=86400000;
  const all=(msgs||[]).filter(isWeeklyMsg);
  // لكل نوع ومادة (السطر الأول من الرسالة) آخر رسالة فقط، خلال الأيام الأخيرة، أو الأقدم إن لم يُقرّ بها بعد
  const latest=new Map();
  for(const m of all){const key=String(m.body).split('\n')[0].trim();const prev=latest.get(key);if(!prev||new Date(m.created_at)>new Date(prev.created_at))latest.set(key,m)}
  const list=[...latest.values()].filter(m=>{const age=now-new Date(m.created_at).getTime();return age<=WEEKLY_DAYS*day||(!m.acknowledged_at&&age<=WEEKLY_UNACK_DAYS*day)}).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  if(!list.length){slot.innerHTML='';return}
  const pending=list.filter(m=>!m.acknowledged_at).length;
  slot.innerHTML=`<section class="weekly"><h3>📌 من المعلم هذا الأسبوع${list.length>1?` (${n(list.length)})`:''}</h3>${pending?`<p class="meta">بانتظار اطلاعكم: ${n(pending)}</p>`:'<p class="ack-done">✓ اطّلعتم على جميع الرسائل</p>'}<div class="notices"></div></section>`;
  const host=slot.querySelector('.notices');
  for(const m of list){
    const kind=noticeKind(m.body),wrap=document.createElement('div'),needsPledge=kind!=='thanks';
    const pledge=kind==='violation'?'أتعهد بتوجيه ابني والتعاون مع المعلم في معالجة هذه المخالفات':'أتعهد بمتابعة تنفيذ هذه الخطة مع ابني';
    let ackHtml;
    if(m.acknowledged_at)ackHtml=`<p class="ack-done">✓ ${needsPledge?'أقررتم وتعهدتم':'أقررتم بالاطلاع'}${m.ack_name?` باسم: ${escapeHtml(m.ack_name)}`:''} — ${chatTime(m.acknowledged_at)}</p>`;
    else if(needsPledge)ackHtml=`<div class="pledge"><label class="pledge-check"><input type="checkbox" class="pl-ok"> ${pledge}</label><input type="text" class="pl-name" maxlength="80" placeholder="اكتب اسم ولي الأمر" autocomplete="name"><button type="button" class="ack-btn" disabled>اعتماد الإقرار والتعهد</button><p class="meta">يُسجَّل اسمكم ووقت الاعتماد، ويصل إلى المعلم.</p></div>`;
    else ackHtml=`<button type="button" class="ack-btn">اطّلعت، شكرًا لكم</button>`;
    wrap.innerHTML=`<div class="card ${kind==='thanks'?'good':'warn'}"><div class="plan">${escapeHtml(m.body)}</div><p class="meta">أُرسلت في ${chatTime(m.created_at)}</p>${ackHtml}</div>`;
    const btn=wrap.querySelector('.ack-btn'),ok=wrap.querySelector('.pl-ok'),nm=wrap.querySelector('.pl-name');
    if(btn&&needsPledge){const upd=()=>{btn.disabled=!(ok.checked&&nm.value.trim().length>=3)};ok.onchange=upd;nm.oninput=upd}
    if(btn)btn.onclick=async()=>{const name=nm?nm.value.trim():'';if(needsPledge&&!(ok.checked&&name.length>=3))return;btn.disabled=true;btn.textContent='جارٍ الإرسال...';const {error}=await supa.rpc('acknowledge_message',{p_id:String(m.id),p_name:name||null});if(error){btn.disabled=false;btn.textContent='تعذّر الإرسال، أعد المحاولة';return}m.acknowledged_at=new Date().toISOString();m.ack_name=name||null;renderWeekly(slot,msgs)};
    host.appendChild(wrap);
  }
}

async function loadParentChat(card,studentId){
  const chat=card.querySelector('.chat');
  const {data,error}=await supa.from('parent_messages').select('*').eq('student_id',studentId).order('created_at',{ascending:true});
  if(error){chat.innerHTML='<p class="error">تعذّر تحميل الرسائل: '+escapeHtml(error.message)+'</p>';return;}
  chat.replaceChildren();
  if(!data?.length)chat.innerHTML='<p class="muted">لا توجد رسائل بعد. يمكنك بدء المحادثة مع المعلم.</p>';
  for(const m of data||[]){
    const div=document.createElement('div');
    div.className='bubble '+(m.sender_role==='parent'?'parent':'teacher');
    div.innerHTML=`<div class="body">${escapeHtml(m.body)}</div><div class="when">${m.sender_role==='parent'?'أنت':'المعلم'} — ${chatTime(m.created_at)}</div>`;
    chat.appendChild(div);
  }
  chat.scrollTop=chat.scrollHeight;
  const slot=document.querySelector(`.weekly-slot[data-student="${CSS.escape(studentId)}"]`);
  if(slot&&!slot.dataset.rendered){slot.dataset.rendered='1';renderWeekly(slot,data)}
  const unread=(data||[]).filter(m=>m.sender_role==='teacher'&&!m.read_at).map(m=>String(m.id));
  if(unread.length){try{await supa.rpc('mark_messages_read',{p_ids:unread})}catch(_){}}
}

async function wireParentChats(){
  const {data:{user}}=await supa.auth.getUser();
  for(const card of document.querySelectorAll('.chat-card')){
    const studentId=card.dataset.student;
    await loadParentChat(card,studentId);
    card.querySelector('.send-msg').onclick=async()=>{
      const ta=card.querySelector('textarea'),status=card.querySelector('.msg-status'),body=ta.value.trim();
      if(!body){status.textContent='اكتب الرسالة أولًا.';return;}
      status.textContent='جارٍ الإرسال...';
      const {error}=await supa.from('parent_messages').insert({student_id:studentId,parent_uid:user.id,sender_role:'parent',body});
      if(error){status.textContent='تعذّر الإرسال: '+error.message;return;}
      ta.value='';status.textContent='تم الإرسال.';await loadParentChat(card,studentId);
    };
  }
  if(window.__parentMsgTimer)clearInterval(window.__parentMsgTimer);
  window.__parentMsgTimer=setInterval(()=>{
    if(document.activeElement&&document.activeElement.tagName==='TEXTAREA')return;
    document.querySelectorAll('.chat-card').forEach(card=>loadParentChat(card,card.dataset.student));
  },15000);
}

  reportsBox.innerHTML='<section><p class="muted">جارٍ التحميل...</p></section>';
  const {data:teacherFlag}=await supa.rpc('is_teacher');
  if(teacherFlag===true){showMessage('<p class="error">أنت مسجّل الآن بحساب المعلم. سجّل الخروج ثم ادخل بحساب ولي الأمر.</p>');return}
  const code=pendingCode();let linkError=null;
  if(code){const {error}=await supa.rpc('redeem_link_code',{p_code:code});clearPendingCode();if(error)linkError=error.message}
  const {data,error}=await supa.from('students_public').select('*');
  if(error){showMessage(`<p class="error">تعذّر جلب البيانات: ${escapeHtml(error.message)}</p>`);return}
  const rows=data||[];
  if(!rows.length){
    if(linkError)showMessage(`<p class="error">تعذّر ربط الحساب: ${escapeHtml(linkError)}</p><p class="muted">اطلب من المعلم رمزًا جديدًا.</p>`);
    else showMessage('<p class="muted">لا يوجد أي طالب مرتبط بحسابك بعد. امسح باركود الطالب الذي أعطاك إياه المعلم.</p>');
    return;
  }
  const known=loadKnown(),fresh=rows.find(r=>!known.includes(r.id));
  if(fresh&&code&&!linkError)lsSet(SELECTED_KEY,fresh.id);
  saveKnown(rows.map(r=>r.id));
  __parentNotice=linkError?'هذا الرابط استُخدم من قبل أو انتهت صلاحيته. إذا كان لابنك المعروض أدناه فلا مشكلة، فحسابك مربوط به. وإذا كان لابن آخر فاطلب من المعلم رمزًا جديدًا.':'';
  __parentRows=rows;renderParentView();
  for(const row of rows)supa.rpc('mark_report_viewed',{p_student_id:row.id}).then(()=>{},()=>{});
}

function friendlyAuthError(m){
  if(m==='Invalid login credentials')return 'البريد أو كلمة المرور غير صحيحة.';
  if(/already registered/i.test(m))return 'هذا البريد مسجّل من قبل، اختر «لديّ حساب».';
  if(/Password should be/i.test(m))return 'كلمة المرور قصيرة، اكتب 6 خانات على الأقل.';
  if(/Email not confirmed/i.test(m))return 'لم يُؤكَّد البريد بعد. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.';
  if(/rate limit|too many|security purposes/i.test(m))return 'طلبات كثيرة في وقت قصير. انتظر دقيقة ثم أعد المحاولة.';
  if(/invalid.*email|Unable to validate email/i.test(m))return 'اكتب البريد الإلكتروني بشكل صحيح.';
  if(/should be different/i.test(m))return 'اختر كلمة مرور مختلفة عن القديمة.';
  return m;
}
function passField(id,auto,ph){return `<div style="position:relative"><input id="${id}" name="password" type="password" placeholder="${ph}" autocomplete="${auto}" style="padding-left:70px"><button type="button" class="secondary pass-eye" data-for="${id}" style="position:absolute;left:6px;top:50%;transform:translateY(-50%);width:auto;min-height:auto;padding:4px 10px;margin:0;font-size:.85rem">إظهار</button></div>`}
function wireEyes(root){root.querySelectorAll('.pass-eye').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.for);const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'إخفاء':'إظهار'})}

function renderAuthForm(mode){
  const hasCode=!!pendingCode();
  if(mode==='forgot'){
    authBox.innerHTML=`<h3>استعادة كلمة المرور</h3><p class="muted">اكتب بريدك المسجّل، وسنرسل إليه رابطًا لتعيين كلمة مرور جديدة. (لأمان حسابك لا تُرسل كلمة المرور نفسها بالبريد.)</p>
      <form id="forgotForm" autocomplete="on"><input id="paEmail" name="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username email" required><button type="submit">إرسال رابط الاستعادة</button></form>
      <p id="paMsg" class="error"></p><button type="button" class="secondary" id="backLogin">رجوع لتسجيل الدخول</button>`;
    document.getElementById('backLogin').onclick=()=>renderAuthForm('login');
    document.getElementById('forgotForm').onsubmit=async ev=>{
      ev.preventDefault();const email=document.getElementById('paEmail').value.trim(),msg=document.getElementById('paMsg');
      if(!email){msg.textContent='اكتب البريد أولًا.';return}
      msg.classList.remove('error');msg.textContent='جارٍ الإرسال...';
      const {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(error){msg.classList.add('error');msg.textContent=friendlyAuthError(error.message);return}
      renderCodeForm('recovery',email);
    };
    return;
  }
  authBox.innerHTML=`<div class="tabs"><button id="tabLogin" class="${mode==='login'?'active':'secondary'}" type="button">لديّ حساب</button><button id="tabSignup" class="${mode==='signup'?'active':'secondary'}" type="button">حساب جديد</button></div>
    ${hasCode?'<p class="muted">تم حفظ رمز الطالب، وسيُربط بحسابك تلقائيًا بعد تسجيل الدخول أو إنشاء الحساب.</p>':''}
    <form id="authForm" autocomplete="on" method="post" action="#">
      <input id="paEmail" name="email" type="email" placeholder="البريد الإلكتروني" autocomplete="username email" required>
      ${passField('paPass',mode==='login'?'current-password':'new-password','كلمة المرور')}
      ${mode==='signup'?passField('paPass2','new-password','أعد كتابة كلمة المرور'):''}
      <button id="paSubmit" type="submit">${mode==='login'?'تسجيل الدخول':'إنشاء الحساب'}</button>
    </form>
    <p class="muted">💡 عند تسجيل الدخول سيعرض عليك جوالك «حفظ كلمة المرور»؛ اختر «حفظ» لتدخل بعد ذلك بلمسة.</p>
    ${mode==='login'?'<button type="button" class="secondary" id="forgotBtn">نسيت كلمة المرور؟</button>':''}
    <p id="paMsg" class="error"></p>`;
  wireEyes(authBox);
  document.getElementById('tabLogin').onclick=()=>renderAuthForm('login');
  document.getElementById('tabSignup').onclick=()=>renderAuthForm('signup');
  const fb=document.getElementById('forgotBtn');if(fb)fb.onclick=()=>renderAuthForm('forgot');
  document.getElementById('authForm').onsubmit=async ev=>{
    ev.preventDefault();
    const email=document.getElementById('paEmail').value.trim(),password=document.getElementById('paPass').value,msg=document.getElementById('paMsg');
    if(!email||!password){msg.textContent='أدخل البريد وكلمة المرور.';return}
    if(mode==='signup'&&password!==document.getElementById('paPass2').value){msg.textContent='كلمتا المرور غير متطابقتين.';return}
    msg.textContent='جارٍ المعالجة...';msg.classList.remove('error');
    if(mode==='login'){const {error}=await supa.auth.signInWithPassword({email,password});if(error){msg.textContent=friendlyAuthError(error.message);msg.classList.add('error');return}showReports();return}
    const {data,error}=await supa.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error){msg.textContent=friendlyAuthError(error.message);msg.classList.add('error');return}
    if(data&&data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){msg.classList.add('error');msg.textContent='هذا البريد مسجّل من قبل. اختر «لديّ حساب»، أو «نسيت كلمة المرور».';return}
    if(data&&data.session){showReports();return}
    renderCodeForm('signup',email);
  };
}

// إدخال الرمز المرسل بالبريد (أسلم من الرابط: بعض برامج البريد مثل Hotmail تفتح الروابط تلقائيًا فتُبطلها)
function renderCodeForm(type,email){
  const rec=type==='recovery';
  authBox.innerHTML=`<h3>${rec?'استعادة كلمة المرور':'تأكيد الحساب'}</h3>
    <p class="muted">أرسلنا ${rec?'رمز الاستعادة':'رمز التأكيد'} إلى: <b>${escapeHtml(email)}</b><br>افتح بريدك واكتب الرمز هنا. إن لم تجد الرسالة خلال دقيقتين فابحث في البريد غير المرغوب فيه (Junk/Spam).</p>
    <form id="codeForm" autocomplete="on">
      <input type="email" name="email" autocomplete="username" value="${escapeHtml(email)}" style="display:none">
      <input id="otpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="الرمز المرسل إلى بريدك" style="text-align:center;letter-spacing:6px;font-size:1.3rem">
      ${rec?passField('newPass','new-password','كلمة المرور الجديدة')+passField('newPass2','new-password','أعد كتابتها'):''}
      <button type="submit">${rec?'حفظ كلمة المرور الجديدة':'تأكيد الحساب والدخول'}</button>
    </form>
    <p id="paMsg" class="error"></p>
    <button type="button" class="secondary" id="resendBtn">إعادة إرسال الرمز</button>
    <button type="button" class="secondary" id="backLogin">رجوع لتسجيل الدخول</button>`;
  wireEyes(authBox);
  document.getElementById('backLogin').onclick=()=>renderAuthForm('login');
  document.getElementById('resendBtn').onclick=async()=>{const m=document.getElementById('paMsg');m.classList.remove('error');m.textContent='جارٍ الإرسال...';const {error}=rec?await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}):await supa.auth.resend({type:'signup',email,options:{emailRedirectTo:location.origin+location.pathname}});if(error){m.classList.add('error');m.textContent=friendlyAuthError(error.message);return}m.textContent='✓ أُرسل رمز جديد. استخدم الرمز الأحدث فقط.'};
  document.getElementById('codeForm').onsubmit=async ev=>{
    ev.preventDefault();const token=qpDigits(document.getElementById('otpCode').value),msg=document.getElementById('paMsg');
    if(token.length<6){msg.textContent='اكتب الرمز كاملًا كما وصلك.';return}
    let pass='';
    if(rec){pass=document.getElementById('newPass').value;if(pass.length<6){msg.textContent='كلمة المرور الجديدة 6 خانات على الأقل.';return}if(pass!==document.getElementById('newPass2').value){msg.textContent='كلمتا المرور غير متطابقتين.';return}}
    msg.classList.remove('error');msg.textContent='جارٍ التحقق...';
    const {data,error}=await supa.auth.verifyOtp({email,token,type:rec?'recovery':'signup'});
    if(error||!data?.session){msg.classList.add('error');msg.textContent=/expired|invalid/i.test(error?.message||'')?'الرمز غير صحيح أو انتهت صلاحيته. اضغط «إعادة إرسال الرمز» واستخدم الأحدث.':friendlyAuthError(error?.message||'تعذّر التحقق');return}
    if(rec){const {error:e2}=await supa.auth.updateUser({password:pass});if(e2){msg.classList.add('error');msg.textContent=friendlyAuthError(e2.message);return}}
    msg.textContent=rec?'✓ تم تعيين كلمة المرور الجديدة.':'✓ تم تأكيد حسابك.';setTimeout(showReports,700);
  };
}
function qpDigits(v){return String(v||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g,'')}

function renderResetForm(){
  if(location.hash)history.replaceState(null,'',location.pathname+location.search);
  authBox.style.display='block';reportsBox.style.display='none';
  authBox.innerHTML=`<h3>تعيين كلمة مرور جديدة</h3><form id="resetForm" autocomplete="on"><input type="email" name="email" autocomplete="username" style="display:none" value="">${passField('newPass','new-password','كلمة المرور الجديدة')}${passField('newPass2','new-password','أعد كتابتها')}<button type="submit">حفظ كلمة المرور الجديدة</button></form><p id="paMsg" class="error"></p>`;
  wireEyes(authBox);
  supa.auth.getUser().then(({data})=>{const e=authBox.querySelector('input[name=email]');if(e&&data?.user?.email)e.value=data.user.email});
  document.getElementById('resetForm').onsubmit=async ev=>{
    ev.preventDefault();const a=document.getElementById('newPass').value,b=document.getElementById('newPass2').value,msg=document.getElementById('paMsg');
    if(a.length<6){msg.textContent='اكتب 6 خانات على الأقل.';return}
    if(a!==b){msg.textContent='كلمتا المرور غير متطابقتين.';return}
    msg.classList.remove('error');msg.textContent='جارٍ الحفظ...';
    const {error}=await supa.auth.updateUser({password:a});
    if(error){msg.classList.add('error');msg.textContent=friendlyAuthError(error.message);return}
    history.replaceState(null,'',location.pathname+location.search);
    msg.textContent='✓ تم تعيين كلمة المرور الجديدة.';setTimeout(showReports,900);
  };
}

const IS_RECOVERY=/type=recovery/.test(location.hash)||/type=recovery/.test(location.search);
const AUTH_ERR=(()=>{const h=new URLSearchParams(location.hash.slice(1));return h.get('error_description')||''})();
const teacherPreview=new URLSearchParams(location.search).get('preview')==='1'&&renderTeacherPreview();
if(!teacherPreview)(async()=>{
  try{supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{flowType:'implicit',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(err){authBox.innerHTML='<p class="error">تعذّر الاتصال: '+escapeHtml(err.message)+'</p>';return}
  let recovering=IS_RECOVERY;
  supa.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;renderResetForm()}});
  const {data}=await supa.auth.getSession();
  if(recovering&&data.session){renderResetForm();return}
  if(AUTH_ERR){renderAuthForm('login');const m=document.getElementById('paMsg');if(m)m.classList.remove('error');m.textContent=/expired|invalid/i.test(AUTH_ERR)?'هذا الرابط فُتح من قبل، وقد يكون برنامج البريد (مثل Hotmail) فتحه تلقائيًا للفحص فأكّد حسابك. جرّب تسجيل الدخول بالبريد وكلمة المرور. وإن لم ينجح فاضغط «نسيت كلمة المرور؟».':AUTH_ERR;history.replaceState(null,'',location.pathname+location.search);return}
  if(data.session){if(location.hash.includes('access_token'))history.replaceState(null,'',location.pathname+location.search);showReports()}else renderAuthForm(pendingCode()?'signup':'login');
})();
</script>
